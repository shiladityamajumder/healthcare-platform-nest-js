services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: healthcare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - healthcare_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d healthcare']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  healthcare_pg:
